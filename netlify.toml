# Netlify configuration — 夏草堂 Xia's TCM
# Static site with a tiny build step that generates SEO-friendly article pages.

[build]
  publish = "."
  command = "node tools/build-articles.js"

# Always revalidate the article content file so newly published articles
# appear immediately (everything else can cache normally).
[[headers]]
  for = "/content/articles.json"
  [headers.values]
    Cache-Control = "no-cache"

# Keep the CMS dashboard out of search results.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/Plan.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/Publishing-Guide.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/夏草堂-review.html"
  [headers.values]
    X-Robots-Tag = "noindex"
